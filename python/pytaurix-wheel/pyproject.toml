[project]
name = "pytaurix-wheel"
version = "0.1.0a1" # ❗ when bumping, remember to update workspace dependencies
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Sean Wang", email = "126865849+WSH032@users.noreply.github.com" },
]
requires-python = ">=3.11"
description = "Precompiled wheels for pytaurix"

# <https://iscinumpy.dev/post/bound-version-constraints/>
dependencies = [
    "typing-extensions >= 4.14",
    # ❗ workspaces, must use `==`
    "pytaurix == 0.1.0a1", # NOTE: must keep the same version as crate `pytaurix` in `Cargo.toml`
]

[project.urls]
# see: <https://packaging.python.org/en/latest/specifications/well-known-project-urls/#well-known-labels>
documentation = "https://eclteam.github.io/PyTauriX/"
source = "https://github.com/ECLteam/PyTauriX"


[project.entry-points.pytaurix]
# - "pytaurix_wheel" -> `python/pytaurix_wheel/`
# - "ext_mod" -> `#[pyo3(name = "ext_mod")]` in rust
ext_mod = "pytaurix_wheel.ext_mod"

[build-system]
requires = [
    "setuptools >= 80",
    "setuptools-rust >= 1.11, <2",
    "setuptools-scm >= 8",
    "packaging >= 25",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages]
find = { where = ["python"] }

# see: <https://www.maturin.rs/config>
[tool.maturin]
# the same as [tool.setuptools.packages.find.where]
python-source = "python"
# the same as `[project.entry-points.pytaurix.ext_mod]`,
# i.e., `target` in `setup.py`
module-name = "pytaurix_wheel.ext_mod"
# see `setup.py`
features = ["pyo3/extension-module", "tauri/custom-protocol"]
# equivalent to `setuptools-scm`
sdist-generator = "git"


[tool.uv.sources]
pytaurix = { workspace = true }
