[package]
name = "pytaurix"
version = "0.1.0-alpha.1"
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
authors = { workspace = true }
description = "Tauri binding for Python through Pyo3"


[package.metadata.docs.rs]
# See: https://docs.rs/about/metadata
all-features = true
# NOTE: `--cfg docsrs` is necessary,
# otherwise some tauri dependencies will require linking to system libraries
# that are not available in the `docs.rs` environment.
rustc-args = ["--cfg", "docsrs"]
rustdoc-args = ["--cfg", "docsrs"]


[features]
standalone = ["dep:libc", "dep:dunce"]


tauri-devtools = ["pytaurix-core/tauri-devtools"]
tauri-macos-private-api = ["pytaurix-core/tauri-macos-private-api"]

plugin-notification = ["pytaurix-core/plugin-notification"]
plugin-dialog = ["pytaurix-core/plugin-dialog"]
plugin-clipboard-manager = ["pytaurix-core/plugin-clipboard-manager"]
plugin-fs = ["pytaurix-core/plugin-fs"]
plugin-opener = ["pytaurix-core/plugin-opener"]
plugin-autostart = ["pytaurix-core/plugin-autostart"]
plugin-deep-link = ["pytaurix-core/plugin-deep-link"]
plugin-http = ["pytaurix-core/plugin-http"]
plugin-os = ["pytaurix-core/plugin-os"]
plugin-persisted-scope = ["pytaurix-core/plugin-persisted-scope"]
plugin-positioner = ["pytaurix-core/plugin-positioner"]
plugin-process = ["pytaurix-core/plugin-process"]
plugin-shell = ["pytaurix-core/plugin-shell"]
plugin-single-instance = ["pytaurix-core/plugin-single-instance"]
plugin-updater = ["pytaurix-core/plugin-updater"]
plugin-upload = ["pytaurix-core/plugin-upload"]
plugin-websocket = ["pytaurix-core/plugin-websocket"]
plugin-window-state = ["pytaurix-core/plugin-window-state"]
plugin-global-shortcut = ["pytaurix-core/plugin-global-shortcut"]
plugin-log = ["pytaurix-core/plugin-log"]
plugin-store = ["pytaurix-core/plugin-store"]
plugin-stronghold = ["pytaurix-core/plugin-stronghold"]
plugin-cli = ["pytaurix-core/plugin-cli"]


[dependencies]
tauri = { workspace = true }
tauri-plugin-pytaurix = { workspace = true }

pyo3 = { workspace = true }

libc = { workspace = true, optional = true }
dunce = { workspace = true, optional = true }

# workspace dependencies
pytaurix-core = { workspace = true, features = ["__private"] }
pyo3-utils = { workspace = true, features = ["unstable"] }
