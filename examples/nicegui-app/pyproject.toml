[project]
name = "nicegui-app"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "nicegui >= 2.9.1, < 3",
    "fastapi >= 0.115.6",
    "uvicorn >= 0.34",
    "pytaurix == 0.1.0a1",
    "anyio == 4.*",
    "typing-extensions >= 4",
]

[project.entry-points.pytaurix]
# - "nicegui_app" -> `python/nicegui_app/`
# - "ext_mod" -> `#[pyo3(name = "ext_mod")]` in rust
ext_mod = "nicegui_app.ext_mod"

[build-system]
requires = [
    "setuptools >= 80",
    "setuptools-rust >= 1.11, <2",
    "setuptools-scm >= 8",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages]
find = { where = ["python"] }

# see: <https://www.maturin.rs/config>
[tool.maturin]
# the same as [tool.setuptools.packages.find.where]
python-source = "python"
# the same as `[project.entry-points.pytaurix.ext_mod]`,
# i.e., `target` in `setup.py`
module-name = "nicegui_app.ext_mod"
# see `setup.py`
features = ["pyo3/extension-module", "tauri/custom-protocol", "pyo3/abi3-py39"]
# equivalent to `setuptools-scm`
sdist-generator = "git"


[tool.uv.sources]
pytaurix = { workspace = true }


[tool.ruff]
extend = "../../pyproject.toml"
# TODO: We use the py310 `match` statement, but `requires-python >= 3.9`,
# so we must tell ruff that we target py310.
target-version = "py310"
